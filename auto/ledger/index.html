<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>가계부 · Binaroo</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
html, body { height: 100%; }
body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
.lbar {
  flex: none; display: flex; align-items: center; gap: 6px; position: relative;
  padding: 8px 10px; padding-top: max(8px, env(safe-area-inset-top));
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.lbar a.back {
  display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; flex: none;
  color: var(--muted); text-decoration: none; border-radius: 10px;
}
.lbar a.back svg { width: 20px; height: 20px; }
.lbar h1 { font-size: 17px; font-weight: 900; margin: 0 auto 0 2px; letter-spacing: -.01em; white-space: nowrap; }
.seg { display: inline-flex; flex: none; padding: 3px; gap: 2px; border-radius: 11px; background: var(--bg); border: 1px solid var(--line); }
.seg button {
  border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 14px; font-weight: 700;
  padding: 6px 14px; border-radius: 8px; cursor: pointer; white-space: nowrap;
}
.seg button[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.ibtn {
  display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; flex: none;
  border: 0; background: transparent; color: var(--muted); border-radius: 10px; cursor: pointer; padding: 0;
}
.ibtn svg { width: 18px; height: 18px; }
.ibtn:active, .lbar a.back:active { background: var(--bg); }
.hist { flex: none; }
.hist summary {
  list-style: none; cursor: pointer; font-family: "JetBrains Mono", monospace; font-size: 11px;
  color: var(--muted); padding: 4px 6px; border-radius: 6px;
}
.hist summary::-webkit-details-marker { display: none; }
.hist[open] summary { background: var(--bg); }
.hist .pop {
  position: absolute; right: 10px; top: calc(100% + 6px); z-index: 5; width: min(300px, calc(100vw - 20px));
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
  box-shadow: 0 8px 28px rgba(0,0,0,.12); font-size: 13px; line-height: 1.55;
}
.hist .pop b { display: block; font-size: 12px; color: var(--muted); font-weight: 500; margin-bottom: 6px; }
.hist .pop ul { margin: 0; padding-left: 16px; }
.frames { flex: 1; position: relative; min-height: 0; }
.frames iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }
#gate { flex: 1; overflow: auto; padding: 24px 16px; }
@media (max-width: 380px) { .lbar h1 { display: none; } .seg button { padding: 6px 12px; } }
</style>
</head>
<body>
  <div class="lbar">
    <a class="back" href="/auto/" aria-label="개인 자동화로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <h1>가계부</h1>
    <div class="seg" role="tablist" hidden id="seg">
      <button type="button" role="tab" data-tab="edit" aria-selected="true">빠른 수정</button>
      <button type="button" role="tab" data-tab="stats" aria-selected="false">분석</button>
    </div>
    <button class="ibtn" type="button" id="reload" aria-label="새로고침" title="새로고침" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
    <details class="hist">
      <summary>v1</summary>
      <div class="pop">
        <b>업데이트 기록</b>
        <ul>
          <li><strong>v1</strong> · 2026-10-31 — 빠른 수정과 분석을 한 페이지로 합침. 위 버튼으로 전환하고, 빠른 수정에서 고친 뒤 분석으로 넘어가면 새로 불러옴. 예전 분석 주소(/auto/analysis/)도 여기로 연결.</li>
        </ul>
      </div>
    </details>
  </div>
  <div id="gate"></div>
  <div class="frames" id="frames" hidden>
    <iframe id="f-edit" data-tab="edit" title="가계부 빠른 수정"></iframe>
    <iframe id="f-stats" data-tab="stats" title="가계부 분석" hidden></iframe>
  </div>
  <script src="/assets/lock.js?v=3"></script>
  <script>

    const PAGES = { edit: 'edit.html', stats: 'stats.html' };
    const $ = s => document.querySelector(s);
    const frames = { edit: $('#f-edit'), stats: $('#f-stats') };
    const tabs = [...document.querySelectorAll('.seg button')];
    let tab = new URLSearchParams(location.search).get('tab') === 'stats' ? 'stats' : 'edit';
    let dirty = false; // 빠른 수정에서 뭔가 눌렀으면 분석을 새로 불러오기

    function load(t) { frames[t].src = PAGES[t] + '?t=' + Date.now(); }
    function show(t) {
      tab = t;
      tabs.forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === t)));
      Object.entries(frames).forEach(([k, f]) => { f.hidden = k !== t; });
      if (!frames[t].getAttribute('src') || (t === 'stats' && dirty)) { load(t); if (t === 'stats') dirty = false; }
      history.replaceState(null, '', t === 'stats' ? '?tab=stats' : location.pathname);
    }

    BinLock.mount($('#gate'), GATE, () => {
      $('#gate').remove();
      $('#frames').hidden = false; $('#seg').hidden = false; $('#reload').hidden = false;
      tabs.forEach(b => b.addEventListener('click', () => { if (b.dataset.tab !== tab) show(b.dataset.tab); }));
      $('#reload').addEventListener('click', () => { load(tab); if (tab === 'stats') dirty = false; });
      // 화면 안을 누르면 바깥 창의 포커스가 빠짐 → 빠른 수정을 만졌다는 표시
      window.addEventListener('blur', () => { if (tab === 'edit' && frames.stats.getAttribute('src')) dirty = true; });
      // 탭 안에서 다른 주소로 넘어가면: 가계부 링크면 탭만 바꾸고, 그 밖의 링크는 바깥 창에서 열기
      Object.entries(frames).forEach(([k, f]) => f.addEventListener('load', () => {
        if (!f.getAttribute('src')) return;
        let loc; try { loc = f.contentWindow.location; } catch (e) { return; }
        const p = loc.pathname;
        if (p.endsWith('/' + PAGES[k]) || loc.href === 'about:blank') return;
        if (/^\/auto\/(ledger|analysis)\/?(index\.html)?$/.test(p)) {
          load(k);
          show(p.startsWith('/auto/analysis') || new URLSearchParams(loc.search).get('tab') === 'stats' ? 'stats' : 'edit');
        } else {
          const href = loc.href; load(k); location.href = href;
        }
      }));
      show(tab);
    });
  })();
  </script>

</html>
