  BinLock.mount(document.getElementById('mount'), ENC, html => {
    // v4.6 버전 표시와 업데이트 기록. 잠긴 원본은 v4.5 그대로라 여기서 덧붙여요.

    if (html.indexOf('가계부 v4.5 · ') > -1) {
      html = html.replace(/가계부 v4\.5 · [\d-]+/, () => '가계부 v4.6 · 2026-11-10')
        .replace(/<li><b>v4\.5<\/b> <span class="now">현재 · ([\d-]+)<\/span>/, (m, d) =>
          '<li><b>v4.6</b> <span class="now">현재 · 2026-11-10</span><div>새 버전이 바로 보이게: github.io 주소는 페이지를 10분 동안 저장해 두고 써서 새로 올린 버전이 늦게 보였어요. 이제 열 때 새 버전이 있는지 확인하고, 있으면 한 번만 새로고침해요. 구글 시트 접속을 미리 열어 두고 글꼴을 기다리지 않게 해서 조금 더 빨리 열려요.</div></li>\n    <li><b>v4.5</b> ' + d);
    }
    // 열고 나서 새 버전이 올라왔는지 확인 (github.io는 10분 동안 예전 페이지를 쓸 수 있어요). 있으면 한 번만 새로고침.
    const checkNew = () => fetch(location.href.split('#')[0], { cache: 'no-cache' })
      .then(r => r.ok ? r.text() : '')
      .then(t => {
        const m = t.match(/\/\*ENC\*\/\{[^}]*?"i":"([^"]+)"/);
        if (!m || m[1] === ENC.i) return;
        const k = 'gb-new-' + m[1];
        try { if (sessionStorage.getItem(k)) return; sessionStorage.setItem(k, '1'); } catch (e) { return; }
        location.reload();
      }).catch(() => {});
    const go = () => { document.open(); document.write(html); document.close(); checkNew(); };
    // 페이지를 다 읽기 전에 바꾸면 내용이 덧붙여지므로, 다 읽은 뒤 교체
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => setTimeout(go, 0)); else go();
