<body>
  <div class="shell">
    <aside class="side">

        <a href="/auto/" aria-current="page">개인 자동화<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></a>
      </nav>
    </aside>
    <main>
      <header>
        <h1 class="page">개인 자동화</h1>
        <p class="lead">생활과 일을 편하게 만드는 도구들.</p>
      </header>
      <div id="mount"></div>
      <div class="grid auto" id="list" hidden></div>
      <div class="bar" id="bar" hidden><button class="btn ghost" id="relock" type="button">잠그기</button></div>
      <footer>© Binaroo</footer>
    </main>
  </div>
  <script src="/assets/lock.js"></script>
  <script>
  const ENC = /*ENC*/{"i":"k00Hmu8xSLiuv41i","c":"K3rOqJdC6Wara1Wwm8dLEKyBCjnfte7vPyOatc6zuFJ17xDFr7Do/9U5sy5RQ9H6ORoE0A4MZKW75AtQT4Pb1yxOUyua9AtrLJav0ZNQr8FW7MoyPszVWFKeM3/zDWGinZLXL7ZnmihIkCfkU4qerl9SfoSjf8f7qfqXqluCghkYGWfMs8UlzdLd7/4gxjZz0/X2Ot5/zK1rlxJJ36t/p11fxInI9FULjfQxT2UAl4h208NWz9LUd15cf0yJNN6qiYaT7h0bbjH2xQ69DbdfZg141Y8C+Vj/20hLYgEcbje+O4EwcUEjLQ98X2Q5St+AYjOC0AMpirJMyPRzBO5ECq1W1SqZtrnPTEDdV4NLeJwP1szUCzXh5Un9JgcB6t7dFNjM1AyTMHQ2EilDUkzwd+9+/h+j2289OGhZ5ucYwbn6jRb2GjV4ByM+UkNuesE2sXocHRq36nupamk="}/*ENC*/;
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  BinLock.mount(document.getElementById('mount'), ENC, txt => {
    const items = JSON.parse(txt), list = document.getElementById('list');
    list.innerHTML = items.map(w => {
      const inner = `<span class="kind">${esc(w.kind)}</span><h3>${esc(w.title)}</h3><p>${esc(w.desc)}</p>`;
      return w.url ? `<a class="card" href="${esc(w.url)}">${inner}</a>` : `<div class="card">${inner}</div>`;
    }).join('');
    list.hidden = false; document.getElementById('bar').hidden = false;
  });
  document.getElementById('relock').addEventListener('click', () => { BinLock.forget(); location.reload(); });
  </script>
