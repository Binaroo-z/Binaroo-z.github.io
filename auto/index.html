  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  BinLock.mount(document.getElementById('mount'), ENC, txt => {
    const items = JSON.parse(txt), list = document.getElementById('list');
    list.innerHTML = items.map(w => {
      const inner = `<span class="kind">${esc(w.kind)}</span><h3>${esc(w.title)}</h3><p>${esc(w.desc)}</p>`;
      return w.url ? `<a class="card" href="${esc(w.url)}">${inner}</a>` : `<div class="card">${inner}</div>`;
    }).join('');
    list.hidden = false; document.getElementById('bar').hidden = false;
  });
  document.getElementById('relock').addEventListener('click', () => { BinLock.forget(); location.reload(); });
  </script>
