    // 페이지를 다 읽기 전에 바꾸면 내용이 덧붙여지므로, 다 읽은 뒤 교체
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => setTimeout(go, 0)); else go();
  });
  </script>
</body>
</html>
